
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212121">
    <title>StudyAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-icon">S</div>
                <span>StudyAI</span>
            </div>

            <button type="button" id="newChatBtn" class="new-chat">
                <span>＋</span> Cuộc trò chuyện mới
            </button>
        </div>

        <div class="sidebar-bottom">
            <div class="profile">
                <div class="avatar">S</div>
                <div>
                    <strong>StudyAI</strong>
                    <small>Trợ lý học tập</small>
                </div>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
    <button type="button" id="menuBtn" class="icon-button"
            aria-label="Mở thanh bên">☰</button>

    <div class="mobile-brand">StudyAI <span>⌄</span></div>
    <div class="topbar-label">Gia sư AI</div>

    <button type="button" id="themeToggle"
            class="theme-toggle" aria-label="Chuyển giao diện sáng tối"
            title="Đổi giao diện">☀️</button>
</header>

        <section class="chat-area">
            <div id="messages" class="messages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">✳</div>
                    <h1>Hôm nay bro muốn học gì?</h1>
                    <p>Hỏi bài, giải thích kiến thức hoặc cùng StudyAI luyện tập nhé.</p>
                </div>
            </div>

            <div class="composer-wrap">
                <form id="chatForm" class="composer">
                    <input
                        id="question"
                        type="text"
                        placeholder="Nhắn tin cho StudyAI..."
                        autocomplete="off"
                        aria-label="Nhập câu hỏi"
                        required
                    >
                    <button type="submit" aria-label="Gửi câu hỏi"
                            class="send-button">↑</button>
                </form>
                <p class="disclaimer">
                    StudyAI có thể mắc lỗi. Hãy kiểm tra lại thông tin quan trọng nhé.
                </p>
            </div>
        </section>
    </main>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
   <script>
    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("studyAI_theme");
    const initialTheme = savedTheme === "light" ? "light" : "dark";

    function applyTheme(theme) {
        document.body.dataset.theme = theme;
        themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
        themeToggle.title = theme === "dark"
            ? "Chuyển sang giao diện sáng"
            : "Chuyển sang giao diện tối";
        localStorage.setItem("studyAI_theme", theme);
    }

    applyTheme(initialTheme);

    themeToggle.addEventListener("click", () => {
        const nextTheme =
            document.body.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
    });
</script>
<script src="index.js"></script>
</body>
</html>
