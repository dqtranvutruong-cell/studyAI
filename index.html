
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="chat">
        <h2>📚 StudyAI</h2>

        <div id="messages">
            <p class="message">Xin chào bro! Hôm nay muốn học gì?</p>
        </div>

        <form id="chatForm">
            <input
                id="question"
                type="text"
                placeholder="Nhập câu hỏi của bro..."
                autocomplete="off"
                required
            >
            <button type="submit">Gửi</button>
        </form>
    </main>

    <script src="index.js"></script>
</body>
</html>
